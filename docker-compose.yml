networks:
  quazex_network:

volumes:
  kafka_volume:
  rabbitmq_volume:
  clickhouse_volume:
  opensearch_volume:
  postgresql_volume:
  redis_volume:

services:
  kafka-broker:
    container_name: quazex_kafka_broker
    hostname: quazex.kafka.broker
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: BROKER://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: BROKER://quazex.kafka.broker:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_MAX_REQUEST_SIZE: 209715200
      KAFKA_MESSAGE_MAX_BYTES: 209715200
      KAFKA_MAX_PARTITION_FETCH_BYTES: 209715200
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256,PLAIN
      KAFKA_SASL_MECHANISM_CONTROLLER_PROTOCOL: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_BROKER_SCRAM-SHA-256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_LISTENER_NAME_BROKER_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_LISTENER_NAME_CONTROLLER_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_LISTENER_NAME_CONTROLLER_SCRAM-SHA-256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM-SHA-256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_LISTENER_NAME_EXTERNAL_PLAIN_SASL_JAAS_CONFIG: org.apache.kafka.common.security.plain.PlainLoginModule required username="quazex" password="quazex" user_quazex="quazex";
      KAFKA_OPTS: "-Djava.security.debug=gssloginconfig,configfile,configparser,logincontext"
    volumes:
      - kafka_volume:/var/lib/kafka/data
    networks:
      - quazex_network
    ports:
      - 9094:9094
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 2


  kafka-console:
    container_name: quazex_redpanda
    image: redpandadata/console:v2.6.0
    environment:
      KAFKA_BROKERS: quazex.kafka.broker:9092
      KAFKA_SASL_ENABLED: true
      KAFKA_SASL_USERNAME: quazex
      KAFKA_SASL_PASSWORD: quazex
      SERVER_LISTENPORT: 9080
    networks:
      - quazex_network
    ports:
      - 39080:9080


  rabbit:
    container_name: quazex_rabbit
    hostname: quazex.rabbit
    image: rabbitmq:3.9.29-management
    volumes:
      - ./.docker/configs/rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
      - ./.docker/configs/rabbitmq-config.conf:/etc/rabbitmq/rabbitmq.conf
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - quazex_network
    ports:
      - 35672:5672
      - 31567:15672
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 20s
      timeout: 10s
      retries: 2


  clickhouse:
    container_name: quazex_clickhouse
    hostname: quazex.clickhouse
    image: clickhouse/clickhouse-server:24.8.4
    restart: unless-stopped
    volumes:
      - ./.docker/configs/clickhouse-users.xml:/etc/clickhouse-server/users.d/quazex.xml
      - clickhouse_volume:/var/lib/clickhouse
    networks:
      - quazex_network
    ports:
      - 38123:8123
      - 39000:9000
      - 39004:9004
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8123 || exit 1
      interval: 20s
      timeout: 10s
      retries: 2


  opensearch:
    image: opensearchproject/opensearch:2.16.0
    container_name: quazex_opensearch
    hostname: quazex.opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: true
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: quazex
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      DISABLE_SECURITY_PLUGIN: true
    volumes:
      - opensearch_volume:/usr/share/opensearch/data
    networks:
      - quazex_network
    ports:
      - 39200:9200 # REST API
      - 39600:9600 # Performance Analyzer
    healthcheck:
      test: curl --silent --fail localhost:9200/_cluster/health || exit 1
      interval: 20s
      timeout: 10s
      retries: 2


  postgresql:
    image: postgres:16.1
    container_name: quazex_postgresql
    hostname: quazex.postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: quazex
      POSTGRES_PASSWORD: quazex
      POSTGRES_DB: quazex
    volumes:
      - postgresql_volume:/var/lib/postgresql/data
      - ./.docker/configs/postgresql-config.conf:/etc/postgresql/postgresql.conf
    networks:
      - quazex_network
    ports:
      - 35432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quazex -t 10"]
      interval: 2s
      timeout: 10s
      retries: 2


  redis:
    container_name: quazex_redis
    hostname: quazex.redis
    image: redis:7.0.11-alpine3.18
    command: redis-server /etc/redis/redis.conf
    restart: always
    volumes:
      - ./.docker/configs/redis-config.conf:/etc/redis/redis.conf
      - redis_volume:/data
    networks:
      - quazex_network
    ports:
      - 36379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 10s
      retries: 2

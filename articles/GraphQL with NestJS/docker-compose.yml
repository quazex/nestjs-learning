networks:
  quazex_apollo_network:

volumes:
  postgresql_volume:

services:
  postgresql:
    image: postgres:16.1
    container_name: quazex_apollo_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: quazex_apollo
      POSTGRES_DB: postgres
    volumes:
      - ./.docker/pagila-schema.sql:/docker-entrypoint-initdb.d/1-pagila-schema.sql
      - ./.docker/pagila-schema-jsonb.sql:/docker-entrypoint-initdb.d/1-pagila-schema-jsonb.sql
      - ./.docker/pagila-data.sql:/docker-entrypoint-initdb.d/2-pagila-data.sql
      - ./.docker/restore-pagila-data-jsonb.sh:/docker-entrypoint-initdb.d/3-restore-pagila-data-jsonb.sh
      - ./.docker/pagila-data-yum-jsonb.backup:/docker-entrypoint-initdb.d/pagila-data-yum-jsonb.backup
      - ./.docker/pagila-data-apt-jsonb.backup:/docker-entrypoint-initdb.d/pagila-data-apt-jsonb.backup
      - postgresql_volume:/var/lib/postgresql/data
    networks:
      - quazex_apollo_network
    ports:
      - 35432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -t 10"]
      interval: 2s
      timeout: 10s
      retries: 2
